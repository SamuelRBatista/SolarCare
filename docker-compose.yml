services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solarcare
      POSTGRES_USER: solarcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - solarcare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarcare -d solarcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solarcare-postgres:
